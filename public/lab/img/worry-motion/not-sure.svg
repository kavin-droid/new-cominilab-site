      <g class="ns-l" fill="#8F8CA6"><rect x="232" y="454" width="118" height="10"/><rect x="232" y="476" width="90" height="10"/></g>
      <rect class="ns-box" x="370" y="436" width="84" height="66" fill="none" stroke="#E6E2D2" stroke-width="3" stroke-dasharray="8 6"/>
