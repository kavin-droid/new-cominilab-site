      <rect class="ns-box" x="370" y="148" width="84" height="66" fill="none" stroke="#E6E2D2" stroke-width="3" stroke-dasharray="8 6"/>
    </g>
    <rect class="ns-sep ns-sep1" x="152" y="230" width="306" height="4" fill="#BEBBD0"/>
    <g class="ns-row ns-r2">
      <circle class="ns-s" cx="187" cy="277" r="30" fill="#8F6CD0"/>
      <g class="ns-l" fill="#8F8CA6"><rect x="232" y="262" width="118" height="10"/><rect x="232" y="284" width="90" height="10"/></g>
      <rect class="ns-box" x="370" y="244" width="84" height="66" fill="none" stroke="#E6E2D2" stroke-width="3" stroke-dasharray="8 6"/>
    </g>
    <rect class="ns-sep ns-sep2" x="152" y="325" width="306" height="4" fill="#BEBBD0"/>
    <g class="ns-row ns-r3">
      <path class="ns-s" d="M187 344 L219 400 H155 Z" fill="#FF8C2A" stroke="#FF8C2A" stroke-width="6" stroke-linejoin="miter"/>
