<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Motion version of worry/not-sure.svg. The scene (8s): the report slides in; its header, then each row (shape and
       lines) fills in; the grades stamp on one by one; only then do the question marks pop up around it; then the report
       slides away and it starts again. Classes ns-* are animated in components/lab/motion/motion.css. -->
  <defs>
    <path id="notsure-q" d="M-22 -34 Q-22 -62 1 -62 Q25 -62 25 -38 Q25 -22 8 -14 Q1 -10 1 2" fill="none" stroke="#8B66C9" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter"/>
  </defs>
  <rect width="600" height="600" fill="#FDF1D4"/>

  <g class="ns-card">
  <g transform="rotate(-5 305 300)">
    <rect x="120" y="62" width="370" height="478" fill="#EDD7A2" transform="translate(-12 12)"/>
    <rect x="120" y="62" width="370" height="478" fill="#FFFFFF"/>
    <rect class="ns-head" x="152" y="94" width="306" height="32" fill="#9478D6"/>

    <g class="ns-row ns-r1">
